[project]
name = "hotel-review-analyzer"
version = "0.1.0"
description = "An explainable, configurable hotel review risk analyzer for traveler-specific decision support"
authors = [
    {name = "Hermes Agent"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
hotel-review-analyzer = "hotel_review_analyzer.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hotel_review_analyzer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
